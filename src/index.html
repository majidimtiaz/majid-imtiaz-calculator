<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <output class="display" id="display" aria-live="polite" aria-label="Display">0</output>

    <div class="keys">
      <button type="button" class="key key-clear key-wide" data-action="clear" aria-label="All clear">AC</button>
      <button type="button" class="key key-fn" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button type="button" class="key key-op" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

      <button type="button" class="key" data-action="digit" data-value="7" aria-label="7">7</button>
      <button type="button" class="key" data-action="digit" data-value="8" aria-label="8">8</button>
      <button type="button" class="key" data-action="digit" data-value="9" aria-label="9">9</button>
      <button type="button" class="key key-op" data-action="operator" data-value="×" aria-label="Multiply">×</button>

      <button type="button" class="key" data-action="digit" data-value="4" aria-label="4">4</button>
      <button type="button" class="key" data-action="digit" data-value="5" aria-label="5">5</button>
      <button type="button" class="key" data-action="digit" data-value="6" aria-label="6">6</button>
      <button type="button" class="key key-op" data-action="operator" data-value="−" aria-label="Subtract">−</button>

      <button type="button" class="key" data-action="digit" data-value="1" aria-label="1">1</button>
      <button type="button" class="key" data-action="digit" data-value="2" aria-label="2">2</button>
      <button type="button" class="key" data-action="digit" data-value="3" aria-label="3">3</button>
      <button type="button" class="key key-op" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button type="button" class="key key-wide" data-action="digit" data-value="0" aria-label="0">0</button>
      <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" class="key key-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
